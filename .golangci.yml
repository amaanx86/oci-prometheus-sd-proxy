linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - gofmt

linters-settings:
  gosec:
    excludes:
      - G304  # file path from variable - intentional for config/key loading
      - G112  # ReadHeaderTimeout - server timeout tuning is out of scope here

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec

run:
  timeout: 5m
