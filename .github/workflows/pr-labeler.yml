name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
